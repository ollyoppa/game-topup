<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameUp | 专业游戏充值平台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* 统一卡片悬停动画 */
        .game-card:hover { transform: translateY(-5px); transition: all 0.3s ease; }
        /* 强制统一图片高度和填充模式，关键修改点 */
        .card-image {
            height: 14rem; /* h-56: 设定一个较高的固定高度，让卡片看起来像海报 */
            width: 100%;   /* w-full */
            object-fit: cover; /* object-cover: 强制图片填满区域，裁切多余部分 */
            object-position: top center; /* object-top: 优先显示图片顶部（人物头部） */
        }
    </style>
</head>
